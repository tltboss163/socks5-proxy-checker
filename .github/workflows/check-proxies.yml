name: Check SOCKS5 Proxies

# Результаты коммитятся в working_proxies.json/.txt/.csv и README.md
on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp aiohttp-socks httpx

      - name: Parse and check proxies
        run: python check_proxies.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working_proxies.json working_proxies.txt working_proxies.csv
          git diff --staged --quiet || git commit -m "Update proxy list [$(date -u +%Y-%m-%d_%H:%M)]"
          git push
